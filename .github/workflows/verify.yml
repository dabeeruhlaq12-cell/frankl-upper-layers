name: Verify research checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  finite-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 check_cutoffs.py
          python3 check_ranks.py
          python3 check_padding.py
  lean-targets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Lean toolchain
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve libraries and build
        run: |
          lake update
          lake exe cache get
          lake build
      - name: Recheck source and inspect axiom reports
        run: |
          set -euo pipefail
          lake env lean -DwarningAsError=true UpperLayers.lean | tee axioms.log
          python3 check_axioms.py axioms.log
